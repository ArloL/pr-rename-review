# Which refs to review for the German-to-English rename on PR #259 (the
# reworked #252, stacked on the #258 prep branch). Pairing needs no
# vocabulary here: the branch's own rename commits record every move, and
# pairup.py reads them from history.

[repo]
# Both refs move on purpose: the point of the tool is to review the PR as it
# is now, so a push has to show up on the page. Building fetches first, so
# there is no separate step to forget. What keeps a moving base safe is refs.py
# resolving it to `git merge-base base head` -- against the branch tip, commits
# main gained since the fork would appear inside the review. The page prints
# the commits it actually built from, so an older build is visibly older.
#
# The regression baseline is pinned separately, in tests/conftest.py. Pinning
# it there is what lets these move.
base = "origin/refactor/german-rename-prep"
head = "origin/refactor/german-to-english-rename-v2"
pr = 259

